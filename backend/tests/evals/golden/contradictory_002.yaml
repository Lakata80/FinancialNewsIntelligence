id: contradictory_002
category: contradictory
description: "Fed target rate: Reuters says 5.25%, AP says 5.50% after FOMC meeting"
articles:
  - id: 1
    ticker: FED
    publisher: Reuters
    title: "Fed raises rates to 5.25%"
    clean_text: >
      The Federal Reserve raised its benchmark rate to 5.25% at the September meeting,
      Reuters reported, citing a Fed statement released at 2:00 PM Eastern time.
  - id: 2
    ticker: FED
    publisher: AP
    title: "FOMC sets rates at 5.50% ceiling"
    clean_text: >
      The Federal Open Market Committee voted to set the target range ceiling at 5.50%,
      with the lower bound at 5.25%, according to the official policy statement
      published on the Fed's website.
expected_status: partial
expected_injection: false
expected_uncertainties: true
must_not_include:
  - "definitively set at 5.375%"
  - "average of"
  - "buy bonds"
  - "sell bonds"
