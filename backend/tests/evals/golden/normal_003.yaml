    title: "Alphabet Q3 beats on Search and YouTube growth"
    clean_text: >
      Alphabet reported third-quarter revenue of $88.3 billion, above Wall Street
      estimates of $86.3 billion. Google Search revenue rose 12.3% to $49.4 billion.
      YouTube advertising revenue grew 12.4% to $8.9 billion. The company reported
      earnings per share of $1.55, beating the consensus estimate of $1.45.
