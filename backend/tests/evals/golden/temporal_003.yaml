id: temporal_003
category: temporal
description: "Old guidance article (2025) + current results article (2026) for MSFT — model should note the difference"
articles:
  - id: 1
    ticker: MSFT
    publisher: Microsoft IR
    title: "Microsoft Q1 FY2026 outlook — February 2025 guidance"
    clean_text: >
      Microsoft provided guidance for Q1 FY2026 in February 2025: revenue expected in
      the range of $68.1 to $69.1 billion, with Azure growth guided at approximately 34%.
  - id: 2
    ticker: MSFT
    publisher: Reuters
    title: "Microsoft Q1 FY2026 actual results — October 2025"
    clean_text: >
      Microsoft reported Q1 FY2026 revenue of $65.6 billion, below its own guidance
      range of $68.1 to $69.1 billion. Azure growth of 31% missed the 34% guidance
      provided in February. CFO Amy Hood cited macroeconomic headwinds.
expected_injection: false
expected_uncertainties: true
must_include_facts:
  - "65.6 billion"
  - "31%"
must_not_include:
  - "revenue of $68.1 billion"
  - "Azure grew 34%"
  - "met guidance"
  - "beat expectations"
  - "buy MSFT"
