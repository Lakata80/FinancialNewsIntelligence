id: normal_001
category: normal
description: "NVDA Q2 FY2025 earnings beat — two publishers with consistent numbers"
articles:
  - id: 1
    ticker: NVDA
    publisher: Reuters
    title: "NVIDIA beats Q2 estimates on AI chip demand"
    clean_text: >
      NVIDIA Corporation reported second-quarter fiscal 2025 revenue of $13.5 billion,
      beating analyst estimates of $11.2 billion. Earnings per share came in at $2.35,
      compared to $0.41 in the same period last year. Data center revenue reached
      $10.3 billion, up 171% year over year. CEO Jensen Huang said the results reflect
      "surging demand for our Hopper GPU architecture."
  - id: 2
    ticker: NVDA
    publisher: Yahoo Finance
    title: "NVDA Q2 results: $13.5B revenue, $2.35 EPS"
    clean_text: >
      NVIDIA posted Q2 FY2025 revenue of $13.5 billion and diluted EPS of $2.35,
      both beating Wall Street forecasts. The data center segment generated $10.3 billion
      in revenue, a 171% increase year over year, driven by strong demand for the H100
      GPU from cloud providers and enterprises building AI infrastructure.
expected_status: verified
